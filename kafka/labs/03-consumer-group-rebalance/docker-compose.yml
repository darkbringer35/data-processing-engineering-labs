services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: lab03-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: DIRECT://:9092,PROXY://:29093,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: DIRECT://localhost:9092,PROXY://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DIRECT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DIRECT:PLAINTEXT,PROXY:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: "classic,consumer"
      KAFKA_GROUP_CONSUMER_HEARTBEAT_INTERVAL_MS: 2000
      KAFKA_GROUP_CONSUMER_MIN_HEARTBEAT_INTERVAL_MS: 1000
      KAFKA_GROUP_CONSUMER_SESSION_TIMEOUT_MS: 15000
      KAFKA_GROUP_CONSUMER_MIN_SESSION_TIMEOUT_MS: 6000

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0
    container_name: lab03-toxiproxy
    ports:
      - "127.0.0.1:8474:8474"
      - "127.0.0.1:29092:29092"
    depends_on:
      - kafka
